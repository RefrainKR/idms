<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>확률 동등성 검증 - Collection vs Efficiency</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #f5f5f5; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        h1 { color: #333; border-bottom: 2px solid #4CAF50; padding-bottom: 10px; }
        .test-case { margin: 20px 0; padding: 15px; background: #f9f9f9; border-left: 4px solid #2196F3; }
        .pass { color: #4CAF50; font-weight: bold; }
        .fail { color: #f44336; font-weight: bold; }
        .info { color: #2196F3; }
        .result { margin: 10px 0; padding: 10px; background: white; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; margin: 10px 0; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #e3f2fd; }
        .diff { background: #ffebee; }
        pre { background: #263238; color: #aed581; padding: 10px; border-radius: 4px; overflow-x: auto; font-size: 0.9em; }
    </style>
</head>
<body>
    <div class="container">
        <h1>확률 동등성 검증: Collection vs Efficiency</h1>
        <p class="info">
            Collection 탭과 Efficiency 탭의 확률 계산이 동등한지 검증합니다.<br>
            <strong>가설</strong>: 일반 N회 + 스탭업 S회 = 스탭업 (N+S)회 (단, maxLoops 한도 내)
        </p>
        <div id="results"></div>
    </div>

    <script type="module">
        import { ProbabilityEngine } from './js/core/ProbabilityEngine.js';
        import { ProbabilityValidator } from './js/utils/ProbabilityValidator.js';
        import { GACHA_RULES } from './js/core/GachaConstants.js';

        const results = document.getElementById('results');
        let passCount = 0, failCount = 0;

        function log(msg, type = 'info') {
            const div = document.createElement('div');
            div.className = `result ${type}`;
            const icon = type === 'pass' ? '✓' : type === 'fail' ? '✗' : 'ℹ';
            div.innerHTML = `<strong>${icon}</strong> ${msg}`;
            results.appendChild(div);
            if (type === 'pass') passCount++;
            if (type === 'fail') failCount++;
        }

        function createTestCase(title) {
            const div = document.createElement('div');
            div.className = 'test-case';
            div.innerHTML = `<h3>${title}</h3>`;
            results.appendChild(div);
            return div;
        }

        /**
         * Collection 탭 로직 시뮬레이션
         */
        function simulateCollection(params) {
            const { N, M, p_indiv, p_step4_indiv, normalPulls, stepPulls, loopRewards,
                    ceilingMode, step4Mode, randomMode } = params;

            let dp = new Array(M + 1).fill(0);
            dp[0] = 1.0;

            // 일반 가챠
            for (let i = 0; i < normalPulls; i++) {
                dp = ProbabilityEngine.runSinglePull(dp, p_indiv);
            }

            // 스탭업 가챠
            let selectCnt = 0;
            for (let i = 1; i <= stepPulls; i++) {
                const isStep4 = (i % GACHA_RULES.STAR3.STEPUP_CYCLE === 0);
                const curLoop = Math.ceil(i / GACHA_RULES.STAR3.STEPUP_CYCLE);
                const useStep4 = (isStep4 && step4Mode === 'included');

                dp = ProbabilityEngine.runSinglePull(dp, useStep4 ? p_step4_indiv : p_indiv);

                if (isStep4) {
                    const reward = loopRewards[curLoop];
                    if (reward === 'random' && randomMode === 'included') {
                        dp = ProbabilityEngine.runRandomTicket(dp, N);
                    } else if (reward === 'select') {
                        selectCnt++;
                    }
                }
            }

            // 천장
            if (ceilingMode === 'included') {
                const normalCeil = Math.floor((normalPulls + stepPulls) / GACHA_RULES.STAR3.CEILING_INTERVAL);
                const totalCeil = selectCnt + normalCeil;
                for (let i = 0; i < totalCeil; i++) {
                    dp = ProbabilityEngine.runGuaranteedPull(dp);
                }
            }

            return dp;
        }

        /**
         * Efficiency 탭 로직 시뮬레이션 (스탭업 가챠)
         */
        function simulateEfficiency(params) {
            const { N, M, p_indiv, p_step4_total, pulls, maxLoops, loopRewards,
                    ceilingMode, step4Mode, randomMode } = params;

            let dp = new Array(M + 1).fill(0);
            dp[0] = 1.0;

            const stepupLimit = maxLoops * GACHA_RULES.STAR3.STEPUP_CYCLE;
            let selectCnt = 0;

            for (let i = 1; i <= pulls; i++) {
                const isStep4 = (i % GACHA_RULES.STAR3.STEPUP_CYCLE === 0);
                const curLoop = Math.ceil(i / GACHA_RULES.STAR3.STEPUP_CYCLE);
                const useStep4 = (isStep4 && i <= stepupLimit && step4Mode === 'included');

                dp = ProbabilityEngine.runSinglePull(dp, useStep4 ? (p_step4_total / N) : p_indiv);

                if (isStep4 && i <= stepupLimit) {
                    const reward = loopRewards[curLoop];
                    if (reward === 'random' && randomMode === 'included') {
                        dp = ProbabilityEngine.runRandomTicket(dp, N);
                    } else if (reward === 'select') {
                        selectCnt++;
                    }
                }
            }

            // 천장
            if (ceilingMode === 'included') {
                const sCeil = selectCnt + Math.floor(pulls / GACHA_RULES.STAR3.CEILING_INTERVAL);
                for (let i = 0; i < sCeil; i++) {
                    dp = ProbabilityEngine.runGuaranteedPull(dp);
                }
            }

            return dp;
        }

        /**
         * 두 확률 분포가 동등한지 비교
         */
        function compareDist(dp1, dp2, tolerance = 0.000001) {
            if (dp1.length !== dp2.length) return false;
            for (let i = 0; i < dp1.length; i++) {
                if (Math.abs(dp1[i] - dp2[i]) > tolerance) {
                    return false;
                }
            }
            return true;
        }

        function showDistribution(dp, label, container) {
            const table = document.createElement('table');
            let html = '<tr><th>획득 개수</th><th>확률</th></tr>';
            for (let i = 0; i < dp.length; i++) {
                if (dp[i] > 0.0001) {  // 유의미한 확률만 표시
                    html += `<tr><td>${i}개</td><td>${(dp[i] * 100).toFixed(6)}%</td></tr>`;
                }
            }
            table.innerHTML = html;

            const div = document.createElement('div');
            div.innerHTML = `<strong>${label}</strong>`;
            div.appendChild(table);
            container.appendChild(div);
        }

        function runTest(testName, params) {
            const section = createTestCase(testName);

            const { N, M, normalPulls, stepPulls } = params;
            const totalPulls = normalPulls + stepPulls;

            section.innerHTML += `
                <div class="info">
                    픽업 인원: ${N}명, 목표: ${M}명<br>
                    Collection: 일반 ${normalPulls}회 + 스탭업 ${stepPulls}회 = 총 ${totalPulls}회<br>
                    Efficiency: 스탭업 ${totalPulls}회 (maxLoops=${params.maxLoops})<br>
                    Step4 모드: ${params.step4Mode}, 랜덤 모드: ${params.randomMode}, 천장: ${params.ceilingMode}
                </div>
            `;

            const dpCollection = simulateCollection(params);
            const dpEfficiency = simulateEfficiency({
                ...params,
                pulls: totalPulls
            });

            const isEqual = compareDist(dpCollection, dpEfficiency);

            if (isEqual) {
                section.innerHTML += '<div class="pass">✓ 확률 분포 일치 (동등성 검증 통과)</div>';
                passCount++;
            } else {
                section.innerHTML += '<div class="fail">✗ 확률 분포 불일치 (동등성 검증 실패)</div>';
                failCount++;

                // 차이 상세 표시
                const diffDiv = document.createElement('div');
                diffDiv.className = 'diff';
                diffDiv.innerHTML = '<strong>차이점:</strong>';

                const diffTable = document.createElement('table');
                let diffHtml = '<tr><th>획득 개수</th><th>Collection</th><th>Efficiency</th><th>차이</th></tr>';
                let hasDiff = false;
                for (let i = 0; i < dpCollection.length; i++) {
                    const diff = Math.abs(dpCollection[i] - dpEfficiency[i]);
                    if (diff > 0.000001) {
                        hasDiff = true;
                        diffHtml += `<tr class="diff">
                            <td>${i}개</td>
                            <td>${(dpCollection[i] * 100).toFixed(6)}%</td>
                            <td>${(dpEfficiency[i] * 100).toFixed(6)}%</td>
                            <td>${(diff * 100).toFixed(6)}%</td>
                        </tr>`;
                    }
                }
                diffTable.innerHTML = diffHtml;
                if (hasDiff) {
                    diffDiv.appendChild(diffTable);
                    section.appendChild(diffDiv);
                }
            }

            // 분포 표시
            const distDiv = document.createElement('div');
            distDiv.style.display = 'grid';
            distDiv.style.gridTemplateColumns = '1fr 1fr';
            distDiv.style.gap = '10px';
            showDistribution(dpCollection, 'Collection 분포', distDiv);
            showDistribution(dpEfficiency, 'Efficiency 분포', distDiv);
            section.appendChild(distDiv);
        }

        // 테스트 실행
        async function runAllTests() {
            const baseParams = {
                N: 2,
                M: 2,
                p_indiv: 0.01,
                p_step4_indiv: 0.01,
                p_step4_total: 0.02,
                ceilingMode: 'excluded',
                step4Mode: 'excluded',
                randomMode: 'excluded',
                loopRewards: {}
            };

            // Test 1: 기본 케이스 (일반 50 + 스탭업 80)
            runTest('Test 1: 일반 50회 + 스탭업 80회 (천장/보상 없음)', {
                ...baseParams,
                normalPulls: 50,
                stepPulls: 80,
                maxLoops: 2
            });

            // Test 2: Step4 활성화
            runTest('Test 2: Step4 활성화 (일반 50 + 스탭업 80)', {
                ...baseParams,
                normalPulls: 50,
                stepPulls: 80,
                maxLoops: 2,
                step4Mode: 'included'
            });

            // Test 3: 주회 보상 포함
            runTest('Test 3: 주회 보상 포함 (random, select)', {
                ...baseParams,
                normalPulls: 50,
                stepPulls: 80,
                maxLoops: 2,
                step4Mode: 'included',
                randomMode: 'included',
                loopRewards: { 1: 'random', 2: 'select' }
            });

            // Test 4: 천장 포함 (200회 이상)
            runTest('Test 4: 천장 포함 (일반 100 + 스탭업 120)', {
                ...baseParams,
                normalPulls: 100,
                stepPulls: 120,
                maxLoops: 3,
                step4Mode: 'included',
                ceilingMode: 'included',
                loopRewards: { 1: 'random', 2: 'select', 3: 'random' }
            });

            // Test 5: 한도 초과 케이스
            runTest('Test 5: 한도 초과 (일반 50 + 스탭업 130, maxLoops=2)', {
                ...baseParams,
                normalPulls: 50,
                stepPulls: 130,
                maxLoops: 2,  // 80회까지만 Step4
                step4Mode: 'included',
                randomMode: 'included',
                loopRewards: { 1: 'random', 2: 'select' }
            });

            // Test 6: 순서 반대 (스탭업 우선)
            runTest('Test 6: 비교 - 스탭업 130회만 (일반 가챠 0회)', {
                ...baseParams,
                normalPulls: 0,
                stepPulls: 130,
                maxLoops: 2,
                step4Mode: 'included',
                randomMode: 'included',
                loopRewards: { 1: 'random', 2: 'select' }
            });

            // 요약
            results.innerHTML += `
                <div style="margin-top: 30px; padding: 20px; background: ${failCount === 0 ? '#c8e6c9' : '#ffcdd2'}; border-radius: 8px;">
                    <h2>검증 결과 요약</h2>
                    <div style="font-size: 18px;">
                        <div class="pass">✓ 통과: ${passCount}</div>
                        <div class="fail">✗ 실패: ${failCount}</div>
                    </div>
                    <div style="margin-top: 15px;">
                        <strong>${failCount === 0 ? '✓ 모든 동등성 검증 통과!' : '✗ 일부 검증 실패 - 확률 계산 불일치'}</strong>
                    </div>
                </div>
            `;
        }

        runAllTests();
    </script>
</body>
</html>
