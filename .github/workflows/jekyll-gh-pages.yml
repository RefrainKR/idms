# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Verify deployment cache-key script
        run: node --test scripts/apply-deployment-cache-key.test.mjs
      - name: Verify clean source asset URLs
        run: node scripts/apply-deployment-cache-key.mjs --check-source scsfp
      - name: Add commit SHA to deployment source URLs
        run: node scripts/apply-deployment-cache-key.mjs --write scsfp "$GITHUB_SHA"
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Verify deployed asset URLs
        run: |
          node scripts/apply-deployment-cache-key.mjs --check _site/scsfp/js "$GITHUB_SHA"
          cache_key="${GITHUB_SHA:0:12}"
          grep -Fq "css/common.css?v=$cache_key" _site/scsfp/index.html
          grep -Fq "css/gacha.css?v=$cache_key" _site/scsfp/index.html
          grep -Fq "css/payment.css?v=$cache_key" _site/scsfp/index.html
          grep -Fq "js/main.js?v=$cache_key" _site/scsfp/index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
